services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: private-rag-postgres
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag -d rag']
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: private-rag-ollama
    profiles:
      - ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  ollama-data:
